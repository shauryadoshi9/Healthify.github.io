<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Tracker - Healthify</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">
        <h2>Sleep Tracker</h2>

        <div style="display: flex; gap: 2rem; flex-wrap: wrap;">

            <div class="card" style="flex: 1; min-width: 300px;">
                <form id="sleep-form">
                    <div class="form-group">
                        <label>Hours Slept</label>
                        <input type="number" id="sleep-hours" min="0" max="24" step="0.5" required
                            placeholder="e.g. 7.5">
                    </div>
                    <div class="form-group">
                        <label>Bedtime</label>
                        <input type="time" id="bedtime">
                    </div>
                    <div class="form-group">
                        <label>Wake-up Time</label>
                        <input type="time" id="wakeup-time">
                    </div>

                    <div class="form-group">
                        <label>Did you dream?</label>
                        <select id="dream">
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Was sleep peaceful?</label>
                        <select id="peaceful">
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>

                    <button type="submit" class="btn" style="width: 100%;">Calculate Quality</button>
                </form>
            </div>

            <div class="card"
                style="flex: 1; min-width: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #e0f2f1;">
                <div id="sleep-score-container" style="text-align: center; display: none;">
                    <h3>Sleep Score</h3>
                    <div style="font-size: 4rem; font-weight: bold; color: #00695c; margin: 1rem 0;" id="sleep-score">--
                    </div>
                    <p id="sleep-quality" style="font-weight: 600; font-size: 1.2rem; margin-bottom: 1rem;">--</p>
                    <div style="background: white; padding: 1rem; border-radius: 8px; border: 1px solid #b2dfdb;">
                        <i class="fas fa-moon" style="color: #00695c;"></i> <span id="sleep-advice">--</span>
                    </div>
                </div>
                <div id="sleep-placeholder" style="text-align: center; color: var(--text-muted);">
                    <i class="fas fa-bed" style="font-size: 4rem; margin-bottom: 1rem;"></i>
                    <p>Enter your sleep details to analyze quality.</p>
                </div>
            </div>

        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/sleep.js"></script>
</body>

</html>
