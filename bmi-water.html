<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI & Water - Healthify</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">
        <h2>Vitals & Hydration</h2>

        <div style="display: flex; flex-wrap: wrap; gap: 2rem;">

            <!-- BMI Section -->
            <div class="card" style="flex: 1; min-width: 300px;">
                <h3><i class="fas fa-weight-scale" style="color:var(--primary-blue)"></i> BMI Calculator</h3>
                <p class="text-muted">Calculated using your profile data.</p>

                <div
                    style="text-align: center; margin: 2rem 0; padding: 2rem; background: var(--soft-blue); border-radius: 50%; width: 200px; height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-left: auto; margin-right: auto;">
                    <div style="font-size: 3rem; font-weight: bold; color: var(--primary-blue);" id="bmi-value">--</div>
                    <div id="bmi-category">Unknown</div>
                </div>

                <div class="result-box"
                    style="background: #f8f9fa; padding: 1rem; border-radius: 8px; border-left: 4px solid var(--primary-blue);">
                    <strong>Suggestion:</strong>
                    <p id="bmi-suggestion">Please update your profile to see results.</p>
                </div>
            </div>

            <!-- Water Section -->
            <div class="card" style="flex: 1; min-width: 300px;">
                <h3><i class="fas fa-glass-water" style="color:var(--primary-blue)"></i> Water Intake</h3>

                <div style="margin: 2rem 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>Target: <strong id="water-target">--</strong> ml</span>
                        <span>Current: <strong id="water-current">0</strong> ml</span>
                    </div>
                    <div style="background: #e9ecef; border-radius: 10px; height: 20px; overflow: hidden;">
                        <div id="water-bar"
                            style="background: var(--primary-blue); height: 100%; width: 0%; transition: width 0.5s;">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Add Water (ml)</label>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-outline" onclick="addWater(250)">+250ml</button>
                        <button class="btn btn-outline" onclick="addWater(500)">+500ml</button>
                        <button class="btn btn-outline" onclick="resetWater()">Reset</button>
                    </div>
                </div>

                <div id="hydration-feedback" class="tip-banner"
                    style="background: var(--soft-blue); border-color: var(--primary-blue); display: none;">
                    <!-- Feedback injected here -->
                </div>
            </div>

        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/bmi.js"></script>
</body>

</html>
