<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Healthify</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">
        <h2>Your Health Profile</h2>

        <div style="display: flex; gap: 2rem; flex-wrap: wrap;">

            <!-- Profile Form -->
            <div class="card" style="flex: 1; min-width: 300px;">
                <form id="profile-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>

                    <div class="form-group" style="display: flex; gap: 1rem;">
                        <div style="flex:1">
                            <label for="age">Age</label>
                            <input type="number" id="age" required placeholder="25">
                        </div>
                        <div style="flex:1">
                            <label for="gender">Gender</label>
                            <select id="gender">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="location">Location (City)</label>
                        <input type="text" id="location" required placeholder="New York">
                    </div>

                    <div class="form-group" style="display: flex; gap: 1rem;">
                        <div style="flex:1">
                            <label for="height">Height (cm)</label>
                            <input type="number" id="height" required placeholder="175">
                        </div>
                        <div style="flex:1">
                            <label for="weight">Weight (kg)</label>
                            <input type="number" id="weight" required placeholder="70">
                        </div>
                    </div>

                    <button type="submit" class="btn" style="width: 100%;">Save Profile</button>
                </form>
            </div>

            <!-- Profile Summary Card -->
            <div class="card"
                style="flex: 1; min-width: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--soft-blue);">
                <i class="fas fa-id-card" style="font-size: 4rem; color: var(--primary-blue); margin-bottom: 1rem;"></i>
                <h3 id="display-name">Guest User</h3>
                <p id="display-location"><i class="fas fa-map-marker-alt"></i> Location not set</p>

                <div style="margin-top: 2rem; width: 100%;">
                    <div
                        style="display: flex; justify-content: space-around; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 1rem;">
                        <div style="text-align: center;">
                            <strong style="display: block; font-size: 1.2rem;" id="display-height">--</strong>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Height (cm)</span>
                        </div>
                        <div style="text-align: center;">
                            <strong style="display: block; font-size: 1.2rem;" id="display-weight">--</strong>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Weight (kg)</span>
                        </div>
                        <div style="text-align: center;">
                            <strong style="display: block; font-size: 1.2rem;" id="display-bmi">--</strong>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Est. BMI</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
